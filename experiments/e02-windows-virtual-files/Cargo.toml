# E-02 Windows clipboard virtual-file paste experiment (Phase 0).
# Isolated, throwaway experiment workspace. It shares no crates with
# OneCopy product code and must not be promoted to product code without
# review. See docs/experiments/E-02_WINDOWS_VIRTUAL_FILE_PASTE.md.

[workspace]
resolver = "3"
members = ["crates/e02-synth", "crates/e02-agent", "crates/e02-verify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
e02-synth = { path = "crates/e02-synth" }
blake3 = "1.8.7"
chacha20 = "0.10.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
windows = "0.62.2"
# Required as a direct dependency by the #[implement] macro; must match windows' windows-core.
windows-core = "0.62.2"
